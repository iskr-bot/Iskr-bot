name: Iskr Engine Automated Scanner

on:
  schedule:
    # Se ejecuta automáticamente cada 15 minutos
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite activarlo manualmente cuando quieras

jobs:
  run-iskr-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Ejecutar Iskr Engine
        run: |
          python iskr_engine_main.py
